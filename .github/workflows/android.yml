name: Android APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK no GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             app/build/outputs/apk/debug/app-debug.apk             --title "Designações JW ${GITHUB_REF_NAME}"             --generate-notes
