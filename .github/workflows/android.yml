name: Android APK
# CI: rebuild on every update to main.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        shell: bash
        run: gradle :shared:test

      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-build-log
          path: build.log

      - name: Verificar configuração de assinatura
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Configure os secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_ALIAS no GitHub."
            exit 1
          fi

      - name: Assinar APK para atualizações futuras
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > designacoes-release.jks
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" sign             --ks designacoes-release.jks             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD"             --key-pass "pass:$ANDROID_KEYSTORE_PASSWORD"             --out app/build/outputs/apk/debug/designacoes-jw.apk             app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/designacoes-jw.apk

      - uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-apk
          path: app/build/outputs/apk/debug/designacoes-jw.apk

      - name: Publicar APK no GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Designações JW $TAG" --generate-notes
          fi
          gh release upload "$TAG" app/build/outputs/apk/debug/designacoes-jw.apk --clobber

# Invitation flow validation build.
