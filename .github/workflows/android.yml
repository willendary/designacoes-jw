name: Android APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK no GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe."
          else
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --target "$GITHUB_SHA" --title "Designações JW $TAG" --generate-notes
          fi
