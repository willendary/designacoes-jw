name: Desktop Windows

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Unit Tests
        shell: pwsh
        run: gradle :shared:test
      - name: Build Windows EXE and MSI
        shell: pwsh
        run: gradle :desktop:packageExe :desktop:packageMsi
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Validar instalador MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "desktop/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "Instalador MSI Windows não encontrado."
          }
          Write-Host "MSI gerado: $($msi.FullName)"
          Write-Host "Tamanho: $([math]::Round($msi.Length / 1MB, 2)) MB"

      - name: Publicar EXE e MSI no GitHub Release
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep 'packageVersion' desktop/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v$VERSION"
          fi
          echo "Publicando para a tag: $TAG"

          MSI=$(find desktop/build/compose/binaries/main/msi -name "*.msi" | head -n 1)
          EXE=$(find desktop/build/compose/binaries/main/exe -name "*.exe" | head -n 1)

          if [ -z "$MSI" ] && [ -z "$EXE" ]; then
            echo "::error::Binários Windows não encontrados."
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Criando release $TAG..."
            gh release create "$TAG" --title "Designações JW $TAG" --generate-notes || true
          else
            echo "Release $TAG já existe."
          fi

          if [ -n "$MSI" ] && [ -f "$MSI" ]; then
            echo "Fazendo upload do MSI: $MSI"
            gh release upload "$TAG" "$MSI" --clobber || true
          fi
          if [ -n "$EXE" ] && [ -f "$EXE" ]; then
            echo "Fazendo upload do EXE: $EXE"
            gh release upload "$TAG" "$EXE" --clobber || true
          fi
