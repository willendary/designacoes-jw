name: Desktop Windows

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows EXE and MSI
        shell: pwsh
        run: gradle :desktop:packageExe :desktop:packageMsi
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
