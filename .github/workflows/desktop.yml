name: Desktop Windows

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Unit Tests
        shell: pwsh
        run: gradle :shared:test
      - name: Build Windows EXE and MSI
        shell: pwsh
        run: gradle :desktop:packageExe :desktop:packageMsi
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: designacoes-jw-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Validar instalador MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "desktop/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "Instalador MSI Windows não encontrado."
          }
          Write-Host "MSI gerado: $($msi.FullName)"
          Write-Host "Tamanho: $([math]::Round($msi.Length / 1MB, 2)) MB"

      - name: Publicar MSI no GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $msi = Get-ChildItem "desktop/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "Instalador MSI Windows não encontrado."
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --title "Designações JW $tag" --generate-notes
          }

          gh release upload $tag $msi.FullName --clobber
